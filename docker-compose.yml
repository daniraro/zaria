version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zaria
      SECRET_KEY: your-secret-key-here
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
